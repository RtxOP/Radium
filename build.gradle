buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        maven { url 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        // MixinGradle: emits the refmap the runtime MixinPlatformAgentDefault expects.
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
        // Shadow: bundles Mixin into the produced JAR.
        // Loaded the ForgeGradle-2.x compatible way (classpath + apply)
        // because the Plugin Portal marker resolves shadow to its 8.x
        // release, which forbids Gradle <3.0.
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'

version          = '0.8.15'
group            = 'com.github.sonagg'
archivesBaseName = 'radium'

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

minecraft {
    version  = '1.8.9-11.15.1.2318-1.8.9'
    runDir   = 'run'
    // Forge 1.8.9 + ForgeGradle 2.1 were tested against SRG/MCP `stable_20`.
    // SRG/MCP stable_22 matches MC 1.8.9 (stable_20 was generated against 1.8.8
    // — using it on 1.8.9 produces class-name/field-name drift that surfaces as
    // mixins referencing non-existent members at runtime).
    mappings = 'stable_22'
    makeObfSourceJar = false
}

// `shade` is the configuration consumed by the shadow plugin to bundle
// Mixin into the produced JAR — Mixin is not on Forge 1.8.9's classpath.
configurations {
    shade
    proguard
    compile.extendsFrom shade
}

repositories {
    maven { url 'https://repo.spongepowered.org/maven' }
    mavenCentral()
}

dependencies {
    // Runtime mixin — shaded into the output JAR so the produced mod
    // is self-contained on Forge 1.8.9. The exclusions dodge the
    // launchwrapper/guava/gson/commons-io copies that Forge/AW already
    // ships on its own classpath.
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }

    // LWJGL 2.9.4-nightly-20150209 in place of the 2.9.2-nightly that
    // ForgeGradle 2.1 pulls for MC 1.8.9. Mojang's canonical 1.8.9
    // version.json pins org.lwjgl.lwjgl:2.9.4-nightly-20150209 on Linux/
    // Windows (the stock 2.9.2-nightly-201408222 ForgeGradle defaults to is
    // the 1.8.8-era artifact whose natives break on modern glibc). NOT the
    // 2.9.4-babric.1 that manuthebyte's template uses on its Linux branch —
    // that artifact exists in no public repository (verified against
    // forge.net, central, sponge, legacyfabric, babric.dev) and its branch
    // is untested upstream (template README: "only tested with IntelliJ").
    compile 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
    compile 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
    compile 'org.lwjgl.lwjgl:lwjgl-platform:2.9.4-nightly-20150209'

    // ProGuard: shrinks the bundled fastutil to the port's actual closure
    // (see the shrinkFastutil task). 6.2.2 runs on the Java 8 build JVM.
    proguard 'net.sf.proguard:proguard-base:6.2.2'

    // joml is a REAL runtime dependency (ChunkRenderMatrices Matrix4f fields,
    // GlUniformMatrix4f Matrix4fc signatures) — shaded like upstream Radium
    // does on Fabric, otherwise the first shader/chunk code hits
    // NoClassDefFoundError.
    // (MixinBaseFrustum is safe without it: javac inlines FrustumIntersection's
    // int constants — verified via constant-pool check.)
    shade 'org.joml:joml:1.10.8'

    // fastutil 8.5.13 — RE-ADDED with the chunk-renderer phase per DOCS.md
    // ("re-add the fastutil dependency when porting the chunk-renderer phase —
    // upstream uses it in ~40 files (meshing, translucent BSP sorts, ...);
    // Forge 1.8.9 ships neither loader-level fastutil nor mixin"). The
    // early-port JDK-collection replacements stay; these files are new
    // ports (ChunkTracker, NativeBuffer pools, translucent sorters, BSP
    // trees) that genuinely need Reference2ReferenceMap / LongHeaps etc.
    // NOT on the 1.8.9 runtime classpath (verified: absent from vanilla
    // 1.8.9 libraries, forge universal jar, and the profile's version.json).
    // COMPILE-TIME ONLY here: the runtime copy in the produced JAR is the
    // shrinkFastutil task's ProGuard output, not the full 23.6 MB jar.
    compile 'it.unimi.dsi:fastutil:8.5.13'

    // Sodium/Radium port libs — present at compile time. jna/slf4j are
    // declared-but-unused in source (parity with upstream, which also never
    // imports them); mixinextras/annotations are compile-time only.
    compile 'io.github.llamalad7:mixinextras-common:0.3.5'
    compile 'net.java.dev.jna:jna:5.14.0'
    compile 'net.java.dev.jna:jna-platform:5.14.0'
    compile 'org.slf4j:slf4j-api:2.0.9'
    compile 'org.jetbrains:annotations:25.0.0'
}

// Force the 2.9.4 natives at resolution time (the compile deps above make the
// classes available; these rules make the *platform* artifact resolve to the
// modern build). Mirrors the canonical 1.8.9 mixin template's macOS branch,
// extended to all platforms — vanilla 1.8.9 ships 2.9.4-nightly-20150209 on
// Linux/Windows too, so there is no platform split.
configurations.all
{
    resolutionStrategy
    {
        dependencySubstitution
        {
            substitute module('org.lwjgl.lwjgl:lwjgl_util:2.9.2-nightly-201408222') with module('org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209')
            substitute module('org.lwjgl.lwjgl:lwjgl:2.9.2-nightly-201408222') with module('org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209')
        }
        force 'org.lwjgl.lwjgl:lwjgl-platform:2.9.4-nightly-20150209'
    }
}

processResources {
    inputs.property 'version',   project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    rename '(.+_at\\.cfg)', 'META-INF/$1'
}

// fastutil keep-roots for the ProGuard shrink: the exact types the port
// references in source (extracted from src/main/java imports + inline refs).
def fastutilKeepClasses = [
    'it.unimi.dsi.fastutil.objects.Object2ObjectOpenHashMap',
    'it.unimi.dsi.fastutil.objects.Object2ReferenceMap',
    'it.unimi.dsi.fastutil.objects.Object2ReferenceOpenHashMap',
    'it.unimi.dsi.fastutil.objects.ObjectArrayList',
    'it.unimi.dsi.fastutil.objects.ObjectOpenHashSet',
    'it.unimi.dsi.fastutil.objects.Reference2ReferenceMap',
    'it.unimi.dsi.fastutil.objects.Reference2ReferenceOpenHashMap',
    'it.unimi.dsi.fastutil.objects.ReferenceArrayList',
    'it.unimi.dsi.fastutil.objects.ReferenceArraySet',
    'it.unimi.dsi.fastutil.objects.ReferenceLinkedOpenHashSet',
    'it.unimi.dsi.fastutil.objects.ReferenceOpenHashSet',
    'it.unimi.dsi.fastutil.objects.ReferenceSet',
    'it.unimi.dsi.fastutil.objects.ReferenceSets',
    'it.unimi.dsi.fastutil.longs.Long2IntLinkedOpenHashMap',
    'it.unimi.dsi.fastutil.longs.Long2ReferenceLinkedOpenHashMap',
    'it.unimi.dsi.fastutil.longs.Long2ReferenceMap',
    'it.unimi.dsi.fastutil.longs.Long2ReferenceMaps',
    'it.unimi.dsi.fastutil.longs.Long2ReferenceOpenHashMap',
    'it.unimi.dsi.fastutil.longs.LongArrayList',
    'it.unimi.dsi.fastutil.longs.LongCollection',
    'it.unimi.dsi.fastutil.longs.LongHeapPriorityQueue',
    'it.unimi.dsi.fastutil.ints.Int2IntOpenHashMap',
    'it.unimi.dsi.fastutil.ints.Int2ReferenceMap',
    'it.unimi.dsi.fastutil.ints.Int2ReferenceOpenHashMap',
    'it.unimi.dsi.fastutil.ints.IntArrayList',
    'it.unimi.dsi.fastutil.ints.IntArrays',
    'it.unimi.dsi.fastutil.ints.IntConsumer',
    'it.unimi.dsi.fastutil.ints.IntOpenHashSet',
    'it.unimi.dsi.fastutil.doubles.Double2ObjectMap',
    'it.unimi.dsi.fastutil.doubles.Double2ObjectRBTreeMap',
    'it.unimi.dsi.fastutil.doubles.Double2ObjectSortedMap',
    'it.unimi.dsi.fastutil.floats.FloatArrays',
    'it.unimi.dsi.fastutil.floats.FloatIterator',
    'it.unimi.dsi.fastutil.floats.FloatOpenHashSet'
]

// Shrinks fastutil 8.5.13 (23.6 MB, ~12 800 classes) down to the closure the
// port actually reaches from the keep classes above (~1.6 MB, ~1 300 classes
// verified locally). ProGuard 6.2.2 runs on the Java 8 build JVM and reads
// the Java 8 rt.jar library; shadowJar merges this output instead of the
// full jar. No obfuscation or optimization — shrink only.
task shrinkFastutil(type: JavaExec) {
    def fastutilJar = configurations.compile.find { it.name.startsWith('fastutil-') }
    def outJar      = file("${buildDir}/fastutil-min.jar")
    def cfgFile     = file("${buildDir}/fastutil.pro")

    inputs.file(fastutilJar)
    outputs.file(outJar)

    doFirst {
        cfgFile.parentFile.mkdirs()
        cfgFile.text = [
            "-injars ${fastutilJar}",
            "-outjars ${outJar}",
            "-libraryjars ${System.getProperty('java.home')}/lib/rt.jar",
            '-dontoptimize',
            '-dontobfuscate',
            '-dontpreverify',
            '-dontnote',
            '-dontwarn',
            '-ignorewarnings',
            '-keepattributes Signature,Exceptions,InnerClasses,EnclosingMethod,Deprecated,*Annotation*',
            fastutilKeepClasses.collect { "-keep class ${it} { *; }" }
        ].flatten().join('\n')
    }

    classpath = configurations.proguard
    main      = 'proguard.ProGuard'
    args      = ["@${cfgFile}"]
}

shadowJar {
    configurations       = [project.configurations.shade]
    dependsOn shrinkFastutil
    from shrinkFastutil
    duplicatesStrategy   = DuplicatesStrategy.EXCLUDE
    classifier           = ''
    // Merge META-INF/services files: the tweak-cascade boot path locates the
    // launchwrapper service via ServiceLoader (IMixinService + bootstrap).
    mergeServiceFiles()
    // joml 1.10.8 ships module-info.class at class-file major 53 (Java 9).
    // ForgeGradle 2.1's reobfShadowJar (SpecialSource / ASM 5.x) only parses
    // up to major 52, so a shaded module-info kills the build with a bare
    // IllegalArgumentException in ClassReader. It is JPMS-only metadata —
    // useless (and ignored) on Java 8 — so just drop it.
    exclude 'module-info.class'
}

// Reobf is a ForgeGradle 2.1 task that runs after `shadowJar`. It
// applies SRG remapping to the produced universal jar.
reobf {
    shadowJar {}
}

// JAR manifest attributes boot Mixin 0.7.11 on Forge 1.8.9 via the tweak
// cascade — no IFMLLoadingPlugin involved.
//
// Why this works (verified against FML source, branch "1.8", and the
// mixin-0.7.11-SNAPSHOT artifact bytecode):
// 1. Mixin 0.7.11's MixinServiceLaunchWrapperBootstrap adds LaunchClassLoader
//    exclusions for org.spongepowered.asm.{service,lib,mixin,util}., so mixin
//    classes must resolve from the SYSTEM classloader.
// 2. FML 1.8.x CoreModManager.discoverCoreMods() scans the mods/ directory
//    itself (setupCoreModDir() returns <mc>/mods). A manifest TweakClass
//    makes handleCascadingTweak() inject the jar URL into the system
//    classloader and register the tweaker (FML CoreModManager.java:296-305).
// 3. MixinTweaker.injectIntoClassLoader() runs MixinBootstrap.inject(), and
//    the MixinPlatformAgentDefault agent reads this jar's MixinConfigs
//    manifest attribute and calls Mixins.addConfiguration() for it
//    (verified in 0.7.11 bytecode: MixinPlatformAgentDefault, MixinTweaker).
// 4. The jar is recorded in CoreModManager.loadedCoremods, so
//    ModDiscoverer.findModDirMods() skips it: it is never scanned for @Mod.
//    Radium is a pure coremod here; config loads lazily on first
//    SodiumClientMod.options() access.
// Relocating org.spongepowered.asm is NOT an alternative: MixinService
// matches the ServiceLoader-discovered service against
// IMixinServiceBootstrap.getServiceClassName() — a string constant the
// relocator does not rewrite — yielding "No mixin host service is available".
jar {
    manifest.attributes(
        'TweakClass'  : 'org.spongepowered.asm.launch.MixinTweaker',
        'TweakOrder'  : '0',
        'MixinConfigs': 'radium-forge.mixins.json'
    )
}

// Reference map: written by MixinGradle during `build`. The runtime mixin
// platform consults this so SRG-mapped targets in production mode
// resolve back to obfuscated MCP names.
sourceSets {
    main {
        ext.refMap = 'radium-forge.mixins.refmap.json'
    }
}
